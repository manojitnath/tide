<!doctype html>
<!-- Mockup: a calmer, Notion-like panel. A line-art character with halftone shading sits where the round player is,
     changing with the state (ready, focus, break) with small looping motion; the radio becomes a slim row below. -->
<meta charset="utf-8">
<style>
:root{--paper:#f6f4ee;--card:#fffefb;--ink:#1b1b1b;--muted:#77736b;--line:rgba(0,0,0,.09);--accent:#2f6fdb}
body{margin:0;background:#e7e4dc;font:13px/1.35 -apple-system,BlinkMacSystemFont,system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;padding:28px 34px}
h1{font-size:21px;margin:0 0 4px}.sub{color:var(--muted);margin:0 0 20px;font-size:13px}
.row{display:flex;gap:26px;align-items:flex-start}
.cap{text-align:center;color:var(--muted);font-size:12px;margin-top:10px}
.panel{width:320px;background:var(--paper);border-radius:16px;padding:16px;box-sizing:border-box;box-shadow:0 18px 40px -14px rgba(0,0,0,.35),0 0 0 .5px rgba(0,0,0,.08);display:flex;flex-direction:column;gap:12px}
.head{display:flex;justify-content:space-between;align-items:flex-start}
.state{font-size:12.5px;font-weight:600;color:var(--muted);display:flex;gap:6px;align-items:center}
.state i{width:7px;height:7px;border-radius:50%;background:var(--ink)}
.time{font:800 46px/1.05 -apple-system,system-ui;letter-spacing:-.02em;margin-top:2px;font-variant-numeric:tabular-nums}
.gear{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;background:var(--card)}
.prog{height:4px;border-radius:9px;background:var(--line);overflow:hidden}.prog i{display:block;height:100%;background:var(--ink);border-radius:9px}
.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:11.5px;height:15px;margin-top:-6px}
/* The character sits straight on the paper: no card, no border. */
.art{height:178px;display:grid;place-items:center;overflow:hidden;position:relative}
.art svg{width:250px;height:178px}
.art .label{display:none}
.radio{display:grid;grid-template-columns:auto 1fr auto auto;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.pp{width:30px;height:30px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center}
.radio b{display:block;font-size:12.5px}.radio small{color:var(--muted);font-size:11px}
.vol{width:54px;height:3px;border-radius:9px;background:var(--line);position:relative}.vol i{position:absolute;left:0;top:0;bottom:0;width:60%;background:var(--ink);border-radius:9px}
.msg{text-align:center;color:var(--muted);font-size:13.5px}
.btn{border-radius:99px;padding:11px 0;text-align:center;font-weight:700;font-size:15px}
.main{background:var(--accent);color:#fff}
.second{border:1px solid rgba(0,0,0,.16);background:#fff}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{border:1px solid var(--line);border-radius:12px;padding:8px 10px;background:var(--card)}
.stat small{display:block;color:var(--muted);font-size:10.5px;font-weight:600}.stat b{font-size:16px}
.foot{display:grid;grid-template-columns:1fr auto 1fr;color:var(--muted);font-size:12px;border-top:1px solid var(--line);padding-top:10px}
.foot span:last-child{justify-self:end}

/* line-art with halftone */
.ink{fill:none;stroke:#1b1b1b;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.solid{fill:#1b1b1b}
.tone{fill:url(#dots)}
.paperfill{fill:#f6f4ee}
/* small loops */
.steam path{animation:steam 3s ease-in-out infinite;opacity:0}
.steam path:nth-child(2){animation-delay:1.5s}
@keyframes steam{0%{opacity:0;transform:translateY(4px)}30%{opacity:.8}100%{opacity:0;transform:translateY(-10px)}}
.type{transform-box:fill-box;transform-origin:50% 100%;animation:type .5s ease-in-out infinite alternate}
@keyframes type{to{transform:translateY(-2px)}}
.nod{transform-box:fill-box;transform-origin:50% 90%;animation:nod 4s ease-in-out infinite}
@keyframes nod{0%,100%{transform:rotate(0)}50%{transform:rotate(3deg)}}
.foot1{transform-box:fill-box;transform-origin:0% 100%;animation:wiggle 1.6s ease-in-out infinite}
@keyframes wiggle{0%,100%{transform:rotate(0)}50%{transform:rotate(-9deg)}}
.star{transform-box:fill-box;transform-origin:center;animation:twinkle 2.4s ease-in-out infinite}
@keyframes twinkle{0%,100%{transform:scale(.8) rotate(0);opacity:.6}50%{transform:scale(1.1) rotate(20deg);opacity:1}}
.breathe{transform-box:fill-box;transform-origin:50% 100%;animation:breathe 3.6s ease-in-out infinite}
@keyframes breathe{50%{transform:scaleY(1.03)}}
</style>
<body>
<h1>Focus MN: a calmer, illustrated panel (mockup)</h1>
<p class="sub">Paper background, black ink, one blue button. The picture changes with the state and moves a little; the radio is a slim row. Nothing built yet.</p>
<svg width="0" height="0" style="position:absolute"><defs><pattern id="dots" width="5" height="5" patternUnits="userSpaceOnUse"><circle cx="2.5" cy="2.5" r="1.05" fill="#1b1b1b"/></pattern></defs></svg>
<div class="row" id="row"></div>
<script>
// Ready: sitting cross-legged with a mug, steam rising.
const ready = `<svg viewBox="0 0 240 170">
  <ellipse cx="120" cy="158" rx="70" ry="5" fill="rgba(0,0,0,.07)"/>
  <g class="breathe">
    <path class="tone" d="M78 150 C78 128 92 120 120 120 C148 120 162 128 162 150 Z"/>
    <path class="ink" d="M78 150 C78 128 92 120 120 120 C148 120 162 128 162 150 Z"/>
    <path class="paperfill" d="M98 122 C96 98 104 84 120 84 C136 84 144 98 142 122 Z"/>
    <path class="ink" d="M98 122 C96 98 104 84 120 84 C136 84 144 98 142 122"/>
    <path class="ink" d="M104 100 h32 M104 110 h32 M112 88 v32 M128 88 v32" stroke-width="1.6"/>
    <circle class="paperfill" cx="120" cy="62" r="17"/><circle class="ink" cx="120" cy="62" r="17"/>
    <path class="solid" d="M103 60 C102 44 112 38 122 38 C134 38 140 46 138 58 C132 50 122 50 112 54 C108 56 105 58 103 60Z"/>
    <path class="ink" d="M113 65 q2-2 4 0 M123 65 q2-2 4 0" stroke-width="2"/>
    <path class="ink" d="M117 72 q3 2 6 0" stroke-width="2"/>
    <path class="ink" d="M104 112 C112 118 122 116 128 108"/>
    <rect class="paperfill" x="126" y="98" width="14" height="14" rx="2"/><rect class="ink" x="126" y="98" width="14" height="14" rx="2"/>
    <path class="ink" d="M140 101 q6 4 0 8" stroke-width="2"/>
  </g>
  <g class="steam"><path class="ink" d="M130 92 q-3-5 0-9 q3-4 0-8" stroke-width="1.8"/><path class="ink" d="M136 92 q-3-5 0-9 q3-4 0-8" stroke-width="1.8"/></g>
</svg>`;
// Focus: at a laptop, typing, a gentle nod.
const focus = `<svg viewBox="0 0 240 170">
  <ellipse cx="120" cy="158" rx="80" ry="5" fill="rgba(0,0,0,.07)"/>
  <path class="ink" d="M40 128 H200"/>
  <path class="tone" d="M86 128 C84 108 94 96 112 96 C130 96 140 108 138 128 Z"/>
  <path class="ink" d="M86 128 C84 108 94 96 112 96 C130 96 140 108 138 128"/>
  <g class="nod"><circle class="paperfill" cx="112" cy="74" r="16"/><circle class="ink" cx="112" cy="74" r="16"/>
    <path class="solid" d="M96 74 C93 56 104 50 114 50 C126 50 131 58 129 68 C120 60 108 62 100 70 Z"/>
    <path class="ink" d="M118 76 h5" stroke-width="2"/><path class="ink" d="M115 84 q3 1 5 0" stroke-width="1.8"/></g>
  <path class="paperfill" d="M138 128 L150 90 H188 L178 128 Z"/><path class="ink" d="M138 128 L150 90 H188 L178 128 Z"/>
  <circle class="solid" cx="166" cy="109" r="3"/>
  <g class="type"><path class="ink" d="M126 114 C134 120 140 122 148 122"/><circle class="paperfill" cx="150" cy="122" r="4"/><circle class="ink" cx="150" cy="122" r="4" stroke-width="2"/></g>
  <path class="ink" d="M58 128 v-30 h18 v30" stroke-width="2.2"/><path class="ink" d="M56 98 h22" stroke-width="2.2"/>
  <path class="ink" d="M62 92 q4-10 8 0" stroke-width="1.8"/>
</svg>`;
// Break: lying back, knees up, one foot swinging, a star twinkling.
const brk = `<svg viewBox="0 0 240 170">
  <ellipse cx="120" cy="150" rx="88" ry="5" fill="rgba(0,0,0,.07)"/>
  <path class="tone" d="M34 146 C34 132 44 128 54 132 Z"/>
  <path class="solid" d="M58 146 C60 128 76 120 102 124 C110 126 112 140 108 146 Z"/>
  <circle class="paperfill" cx="54" cy="128" r="14"/><circle class="ink" cx="54" cy="128" r="14"/>
  <path class="solid" d="M40 124 C40 112 52 108 60 112 C54 114 48 120 46 130 Z"/>
  <path class="ink" d="M56 126 q3 2 6 0" stroke-width="2"/>
  <path class="ink" d="M64 116 C66 96 78 90 82 104" stroke-width="2.4"/>
  <path class="tone" d="M106 146 L132 86 L150 98 L130 146 Z"/><path class="ink" d="M106 146 L132 86 L150 98 L130 146"/>
  <g class="foot1"><path class="tone" d="M140 92 L176 80 L182 96 L148 106 Z"/><path class="ink" d="M140 92 L176 80 L182 96 L148 106"/>
    <path class="ink" d="M178 80 L190 62" /><path class="ink" d="M195 70 q4 6 2 12" stroke-width="1.6"/></g>
  <path class="ink" d="M130 146 L150 118 L172 146"/>
  <g class="star"><path class="ink" d="M92 46 v24 M80 58 h24 M84 50 l16 16 M100 50 l-16 16" stroke-width="2"/></g>
  <path class="ink" d="M70 76 q-8 -10 4 -16" stroke-width="1.8"/>
</svg>`;
const panel = (state, time, dot, metaL, metaR, prog, art, label, msg, main, second, playing) => `<div><div class="panel">
  <div class="head"><div><div class="state"><i style="background:${dot}"></i>${state}</div><div class="time">${time}</div></div><span class="gear">⚙︎</span></div>
  <div class="prog"><i style="width:${prog}%"></i></div><div class="meta"><span>${metaL}</span><span>${metaR}</span></div>
  <div class="art"><span class="label">${label}</span>${art}</div>
  <div class="radio"><span class="pp">${playing ? '❚❚' : '▶'}</span><div><b>Lofi Girl: Study</b><small>FM 88.6${playing ? ' · LIVE' : ''}</small></div><span style="color:var(--muted)">⏭</span><span class="vol"><i></i></span></div>
  <div class="msg">${msg}</div>
  <div class="btn main">${main}</div>${second ? `<div class="btn second">${second}</div>` : ''}
  <div class="stats"><div class="stat"><small>Today</small><b>1h 30m</b></div><div class="stat"><small>Streak</small><b>4 days</b></div><div class="stat"><small>This week</small><b>4h 30m</b></div></div>
  <div class="foot"><span>Dashboard</span><span>Settings</span><span>Quit</span></div></div>`;
document.getElementById('row').innerHTML =
  panel('Pomodoro', '30:00', '#bbb', '', '30 min · 5 min break', 0, ready, 'READY', 'Ready when you are.', 'Start Focus', 'Take break', false) + '<div class="cap" style="display:none"></div></div>' +
  panel('Pomodoro · 30 min', '18:42', '#2f6fdb', 'Started 9:05 AM', 'Ends 9:35 AM', 38, focus, 'DEEP WORK', 'Time for deep work!', 'Pause', '', true) + '</div>' +
  panel('Break', '03:12', '#1fa99b', '', '', 36, brk, 'BREAK', 'Take a short break.', 'Pause', 'Skip break', true) + '</div>';
</script>
</body>
