<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tide</title>
<link rel="stylesheet" href="tide.css">
<style>
/* Manrope (bundled, SIL Open Font License) for all text. In the app it is added from the bundle; this rule is for the browser preview. */
@font-face{font-family:"Manrope Preview";src:url(fonts/Manrope.ttf) format("truetype");font-weight:200 800}
/* Light: soft blue-grey with pastel cards. Dark: near-black. Both use the same bevel: a lit top edge, a soft lower edge and depth below. */
:root{--font:Manrope,"Manrope Preview",ui-rounded,-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --bg:linear-gradient(#f7f8fc,#eceff6);--card:linear-gradient(var(--white),#f6f7fb);
  --pReady:#fbf0d9;--pFocus:#d6e6fd;--pBreak:#e5f5cd;--tReady:#4c3b19;--tFocus:#0f2b4f;--tBreak:#21400f;--timeInk:var(--tag);--track:inset 0 1px 2px rgba(20,40,90,.12);
  --sheen:linear-gradient(rgba(255,255,255,.55),rgba(255,255,255,0) 55%);
  --chip:linear-gradient(var(--white),#f1f3f8);--trackBg:rgba(255,255,255,.7)}
@media (prefers-color-scheme: dark){:root{
  --bg:#161616;--card:linear-gradient(#222,#1c1c1c);
  --pReady:#1f1f1f;--pFocus:#1f1f1f;--pBreak:#1f1f1f;--tReady:#f4d38f;--tFocus:#9ec2ff;--tBreak:#b4e38a;--timeInk:var(--ink);--track:inset 0 1px 2px rgba(0,0,0,.5);
  --sheen:linear-gradient(rgba(255,255,255,.03),rgba(255,255,255,0) 55%);
  --chip:linear-gradient(#333,#272727);--trackBg:rgba(255,255,255,.08)}}
*{box-sizing:border-box}
html,body{margin:0;background:transparent;color:var(--ink);font:var(--weight-regular) var(--text-body)/1.35 var(--font);-webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none;cursor:default}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
input{font:inherit;color:inherit;-webkit-user-select:text;user-select:text}
[hidden]{display:none!important}
/* In a browser the panel sits on a plain backdrop; in the app the window clips it to rounded corners. */
body.preview{background:#dde5f8;min-height:100vh;padding:var(--space-12)}
body.preview .panel{border-radius:var(--radius-xl);box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 0 0 .5px rgba(20,40,90,.12),0 22px 50px rgba(20,40,90,.25)}
@media (prefers-color-scheme: dark){body.preview{background:#0a0a0a}body.preview .panel{box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 0 0 .5px rgba(255,255,255,.1),0 22px 50px rgba(0,0,0,.6)}}
.panel{width:320px;padding:var(--space-6);display:flex;flex-direction:column;gap:var(--space-6);position:relative;background:var(--bg)}

/* the timer card: pastel in light, black in dark, with a soft glow of the state's colour at the bottom */
.timecard{border-radius:var(--radius-xl);padding:var(--space-7) var(--space-8) var(--space-6);background-color:var(--pReady);--tag:var(--tReady);--glow:244,211,143;box-shadow:var(--shadow-panel);
  background-image:var(--sheen),radial-gradient(120% 90% at 50% 125%,rgba(var(--glow),.25),transparent 70%)}
.running .timecard{background-color:var(--pFocus);--tag:var(--tFocus);--glow:58,115,255}
.break .timecard,.breakPaused .timecard{background-color:var(--pBreak);--tag:var(--tBreak);--glow:120,200,80}
/* Ready has no accent: the pill looks like the menu button and there is no glow. */
.idle .timecard{--glow:31,31,31}
.idle .timecard .state{background:var(--chip);color:var(--ink);box-shadow:var(--shadow-chip)}
/* the rings from the group card sit in the top right corner, behind the menu button */
.timecard{background-image:var(--sheen),radial-gradient(circle at 100% 0,transparent 0 62px,rgba(255,255,255,.06) 62px 63px,transparent 63px 104px,rgba(255,255,255,.045) 104px 105px,transparent 105px),radial-gradient(120% 90% at 50% 125%,rgba(var(--glow),.25),transparent 70%)}
/* Light mode: the same card in bright blue. As in dark mode, the state shows in the pill, the progress line and a soft glow at the bottom:
   amber when ready or paused, light blue while focusing, green on a break. */
@media (prefers-color-scheme: light){
  .timecard{background-color:var(--accent);color:var(--white);--tag:#f6cf7e;--glow:255,196,92;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.35),inset 0 -1px 0 rgba(0,0,40,.15),0 0 0 .5px rgba(20,40,90,.12),0 16px 30px -12px rgba(31,92,242,.6);
    background-image:linear-gradient(rgba(255,255,255,.14),rgba(255,255,255,0) 50%),radial-gradient(circle at 100% 0,transparent 0 62px,rgba(255,255,255,.16) 62px 63px,transparent 63px 104px,rgba(255,255,255,.12) 104px 105px,transparent 105px),radial-gradient(circle at 100% 0,rgba(255,255,255,.07) 0 104px,transparent 104px),radial-gradient(130% 95% at 50% 130%,rgba(var(--glow),.75),transparent 72%)}
  .running .timecard{background-color:var(--accent);--tag:#c2dcff;--glow:150,200,255}
  .break .timecard,.breakPaused .timecard{background-color:var(--accent);--tag:#bdea92;--glow:140,225,100}
  .timecard .state{color:var(--ink);box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}
  .timecard .time{color:var(--white)}
  .timecard .prog{background:rgba(255,255,255,.25);box-shadow:inset 0 1px 2px rgba(0,0,40,.2)}
  .timecard .progmeta{color:rgba(255,255,255,.78)}
  .timecard .progmeta.noted #note{color:var(--white)}
  .idle .timecard{--glow:31,92,242}
}
.head{display:flex;justify-content:space-between;align-items:flex-start}
.state{display:inline-flex;align-items:center;background:var(--tag);color:var(--tagInk);border-radius:var(--radius-pill);padding:var(--space-2) var(--space-6);font-size:var(--text-small);font-weight:var(--weight-semibold)}
.paused .state,.breakPaused .state{animation:pulse 1.4s ease-in-out infinite alternate;will-change:opacity}
@keyframes pulse{from{opacity:1}to{opacity:.4}}
.time{display:block;text-align:left;font:var(--weight-semibold) var(--text-display)/1.05 var(--font);letter-spacing:-.01em;font-variant-numeric:tabular-nums;margin-top:var(--space-5);color:var(--timeInk);border-radius:var(--radius-md)}
.time.long{font-size:var(--text-display-sm)}
.idle .time{cursor:pointer}
.idle .time:hover{opacity:.75}
.icon{width:38px;height:38px;border-radius:var(--radius-round);display:grid;place-items:center;color:var(--ink);background:var(--chip);box-shadow:var(--shadow-chip)}
.icon:hover{color:var(--accent)}
.icon svg{width:17px;height:17px}
/* the menu: the corner button turns into a close button and the others drop down under it */
.menu{position:relative;z-index:10}
.menu .x,.menu.open .dots{display:none}
.menu.open .x{display:block}
.menu .icon{width:35px;height:35px}
.menu .icon svg{width:15.5px;height:15.5px}
.menu.open #gear{box-shadow:var(--shadow-chip),0 0 0 1.5px var(--accent)}
.mlist{position:absolute;right:-5px;top:39px;display:flex;flex-direction:column;gap:var(--space-3);padding:var(--space-2);border-radius:var(--radius-pill);visibility:hidden;opacity:0;transform:translateY(-6px);transition:opacity .18s,transform .18s,visibility 0s .18s;
  background:#eef1f7;box-shadow:inset 0 1px 0 var(--white),0 0 0 .5px rgba(20,40,90,.12),0 14px 30px -8px rgba(20,40,90,.35)}
@media (prefers-color-scheme: dark){.mlist{background:#161616;box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 0 0 .5px rgba(255,255,255,.1),0 14px 30px -8px rgba(0,0,0,.8)}}
.menu.open .mlist{opacity:1;transform:none;transition:opacity .18s,transform .18s}
.menu.open .mlist{visibility:visible}
#quit:hover{color:var(--alert)}
#progWrap{margin-top:var(--space-5)}
.prog{height:6px;border-radius:var(--radius-pill);background:var(--trackBg);box-shadow:var(--track);overflow:hidden}
.prog i{display:block;height:100%;width:0;border-radius:var(--radius-pill);background:var(--tag);transition:width .25s linear}
/* Always one line tall, even when empty, so nothing below moves when the text comes and goes. */
.progmeta{display:flex;justify-content:space-between;font-size:var(--text-small);line-height:15px;height:15px;color:var(--muted);font-weight:var(--weight-regular);margin-top:var(--space-3);white-space:nowrap}
.progmeta #note,.progmeta.noted span{display:none}
.progmeta.noted #note{display:block;color:var(--ink);font-weight:var(--weight-semibold);overflow:hidden;text-overflow:ellipsis}

/* buttons: the main action solid blue, a second action a raised card-coloured pill beside it */
.duo{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:var(--space-6)}
.duo button{min-width:0;height:46px;border-radius:var(--radius-pill);font:var(--weight-semibold) var(--text-subheading) var(--font);letter-spacing:-.01em}
.duo .primary{color:var(--white);background:linear-gradient(#3a72ff,#1f5cf2);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),inset 0 -1px 0 rgba(0,0,40,.15),0 8px 18px -8px rgba(31,92,242,.7)}
.duo .secondary{color:var(--ink);background:var(--card);box-shadow:var(--shadow-panel)}
.duo .primary:hover{filter:brightness(1.06)}
.duo .secondary:hover{color:var(--accent)}
.duo button:active{transform:scale(.985)}

/* hover and press: a small lift and a quick press-in, on every button */
.duo button,.icon,.chips button{transition:transform .18s cubic-bezier(.2,.8,.2,1),box-shadow .18s,background-color .18s,color .18s,filter .18s,opacity .18s}
.duo button:hover,.icon:hover{transform:translateY(-1px)}
.duo .primary:hover{filter:brightness(1.06);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),inset 0 -1px 0 rgba(0,0,40,.15),0 12px 22px -8px rgba(31,92,242,.8)}
.chips button:hover{transform:translateY(-1px)}
.duo button:active,.icon:active,.chips button:active{transform:scale(.96);transition-duration:.08s}

/* questions (end of a block or break), shown here when the panel is open, otherwise in the Island under the notch */
.ask{display:flex;flex-direction:column;gap:var(--space-4);border-radius:var(--radius-xl);padding:var(--space-6);background:var(--card);box-shadow:var(--shadow-panel)}
.ask h2{margin:0;font:var(--weight-semibold) var(--text-subheading) var(--font);text-align:center}
.ask p{margin:calc(-1 * var(--space-2)) 0 var(--space-1);color:var(--muted);text-align:center}
.ask input::-webkit-calendar-picker-indicator{display:none!important}
.ask input{width:100%;padding:var(--space-4) var(--space-6);border-radius:var(--radius-md);border:0;background:var(--field);box-shadow:var(--track);outline:none;font-size:var(--text-body-lg)}
.ask input:focus{box-shadow:var(--track),var(--shadow-focus)}
.ask input.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.chips{display:flex;flex-wrap:wrap;gap:var(--space-3);justify-content:center}
.chips button{background:var(--chip);box-shadow:var(--shadow-chip);border-radius:var(--radius-pill);padding:var(--space-2) var(--space-5);font-size:var(--text-small);max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chips button:hover{color:var(--accent)}
.askCats{display:flex;flex-wrap:wrap;align-items:center;gap:var(--space-2);padding-top:1px}
.askCats>span{font-size:var(--text-micro);font-weight:var(--weight-bold);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);align-self:flex-start;padding-top:var(--space-2)}
.askCatChips{display:flex;flex-wrap:wrap;gap:var(--space-2);flex:1 1 0;min-width:0}
/* compact in the 320px panel: the Settings chips are sized for the wide dashboard */
.askCatChip{min-height:24px;padding:3px 6px;gap:4px;font-size:11px;background:none;color:var(--muted);box-shadow:inset 0 0 0 .5px color-mix(in srgb,var(--c) 45%,var(--line))}
.askCatChip i{width:7px;height:7px;border-radius:var(--radius-round);background:var(--c);flex:none}
.askCatChip[aria-checked="true"]{background:var(--c);color:var(--white);box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 2px 5px -2px color-mix(in srgb,var(--c) 60%,transparent)}
.askCatChip[aria-checked="true"] i{background:var(--white)}
.askCatChip:hover{color:var(--ink)}
.askCatChip[aria-checked="true"]:hover{color:var(--white)}

/* greeting and the streak card */
.greet{display:flex;align-items:center;justify-content:space-between;padding:var(--space-1) var(--space-2) 0}
.greet b{display:block;font:var(--weight-bold) var(--text-lede) var(--font)}
.greet span{font-size:var(--text-small);color:var(--muted)}
.fchip{display:flex;align-items:center;gap:var(--space-2);padding:var(--space-2) var(--space-5) var(--space-2) var(--space-4);border-radius:var(--radius-pill);font:var(--weight-bold) var(--text-body) var(--font);background:var(--card);box-shadow:var(--shadow-panel)}
/* the streak chip sits in the clock card's corner */
.timecard .fchip{color:var(--ink);padding:var(--space-3) var(--space-6) var(--space-3) var(--space-4);font-size:var(--text-body-lg)}
.timecard .fchip .f{width:17px;height:17px}
.fchip .f{width:15px;height:15px}
.today{border-radius:var(--radius-xl);padding:var(--space-7);background:var(--card);box-shadow:var(--shadow-panel)}
.trow{display:flex;align-items:center;gap:var(--space-5)}
.trow .big{width:34px;height:34px;flex:none;filter:drop-shadow(0 0 8px rgba(255,90,40,.55))}
.trow small,.goalrow small{display:block;font-size:var(--text-caption);letter-spacing:.08em;color:var(--muted);font-weight:var(--weight-bold)}
.trow b{font:var(--weight-bold) var(--text-heading)/1.1 var(--font)}.trow b span{font-size:var(--text-small);letter-spacing:.06em;color:var(--muted)}
.wk{margin-left:auto;display:flex;gap:var(--space-2)}
.wk .d{display:flex;flex-direction:column;align-items:center;gap:var(--space-1)}
.wk .d::before{content:"";display:none}
.wk .d svg{position:absolute}
.wk .d{position:relative;width:20px}
.wk .d{--s:20px}
.wk .d > small{font-size:var(--text-micro);color:var(--muted);margin-top:var(--space-11)}
.wk .d::after{content:"";position:absolute;top:0;width:20px;height:20px;border-radius:var(--radius-round);background:var(--field);box-sizing:border-box}
.wk .d.done::after{background:linear-gradient(#5fd068,var(--success));box-shadow:0 0 10px -2px rgba(47,174,90,.7)}
.wk .d.now::after{background:none;border:2.5px solid var(--success);border-left-color:var(--field);border-bottom-color:var(--field)}
.wk .d svg{top:4px;width:12px;height:12px;z-index:1;color:var(--on-success)}
.goalrow{display:flex;align-items:flex-end;justify-content:space-between;margin-top:var(--space-6)}
.goalrow b{font:var(--weight-bold) var(--text-heading) var(--font)}.goalrow b span{font-size:var(--text-small);color:var(--muted);font-weight:var(--weight-semibold)}
.goalrow em{font-style:normal;font-size:var(--text-small);color:var(--muted);font-weight:var(--weight-bold)}
.gbar{height:7px;border-radius:var(--radius-pill);background:var(--field);margin-top:var(--space-3);overflow:hidden;box-shadow:var(--track)}
.gbar i{display:block;height:100%;border-radius:var(--radius-pill);background:linear-gradient(90deg,#3a72ff,#5b8cff);box-shadow:0 0 10px rgba(58,114,255,.6)}
</style>
<script>if (!window.Game) document.write('<script src="game.js"><\/script>');</script>
</head>
<body class="idle">
<div class="panel" id="panel">
  <div class="greet"><div><b id="hello">Hello</b><span id="helloSub"></span></div>
    <div class="menu" id="menu">
        <button class="icon" id="gear" type="button" title="Menu"><svg class="dots" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg><svg class="x" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
        <div class="mlist">
          <button class="icon" id="theme" type="button" title="Theme"></button>
          <button class="icon" id="openLog" type="button" title="Dashboard"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="11" width="3.4" height="8" rx="1"/><rect x="10.3" y="5" width="3.4" height="14" rx="1"/><rect x="16.6" y="8" width="3.4" height="11" rx="1"/></svg></button>
          <button class="icon" id="openSettings" type="button" title="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
          <button class="icon" id="quit" type="button" title="Quit Tide"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 3.5v8"/><path d="M7 6.3a7.5 7.5 0 1 0 10 0"/></svg></button>
        </div>
  </div>
  </div>

  <div class="timecard">
  <div class="head">
    <div><div class="state"><i></i><span id="state">Pomodoro</span></div>
      <button class="time" id="time" type="button" title="Click to switch: Count up, 30, 60 or 90 minutes">30:00</button></div>
    <div class="fchip" title="Streak"><svg class="f" viewBox="0 0 24 24"><defs><linearGradient id="fg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffb347"/><stop offset="1" stop-color="#ff4d2e"/></linearGradient></defs><path d="M12 2.5c.6 3.2 4.8 5.6 4.8 10.4A4.8 4.8 0 0 1 12 18a4.8 4.8 0 0 1-4.8-5.1c0-2 1-3.3 2.1-4.5.2 1.6 1 2.6 2.1 2.9-.4-2.8.1-5.6.6-8.8z" fill="url(#fg)"/><path d="M12 12.3c1.4 1.5 2.3 2.4 2.3 3.6a2.3 2.3 0 0 1-4.6 0c0-1.2.9-2.1 2.3-3.6z" fill="#fff3c4"/></svg><span id="chipN">0</span></div>
  </div>
  <div id="progWrap"><div class="prog"><i id="prog"></i></div><div class="progmeta" id="progmeta"><span id="progA"></span><span id="progB"></span><span id="note"></span></div></div>
  </div>

  <div class="actions" id="actions"></div>
  <div class="ask" id="ask" hidden>
    <h2 id="askTitle"></h2><p id="askText"></p>
    <input type="text" id="askInput" list="topicList" maxlength="80" placeholder="What did you work on?" hidden autocomplete="off">
    <datalist id="topicList"></datalist>
    <div class="chips" id="askChips"></div>
    <div class="askCats" id="askCats" hidden><span>Category</span><div class="askCatChips" id="askCatChips"></div></div>
    <div class="duo" id="askBtns"></div>
  </div>
  <div class="today">
    <div class="trow"><svg class="big" viewBox="0 0 24 24"><defs><linearGradient id="fs" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffb347"/><stop offset="1" stop-color="#ff4d2e"/></linearGradient></defs><path d="M12 2.5c.6 3.2 4.8 5.6 4.8 10.4A4.8 4.8 0 0 1 12 18a4.8 4.8 0 0 1-4.8-5.1c0-2 1-3.3 2.1-4.5.2 1.6 1 2.6 2.1 2.9-.4-2.8.1-5.6.6-8.8z" fill="url(#fs)"/><path d="M12 12.3c1.4 1.5 2.3 2.4 2.3 3.6a2.3 2.3 0 0 1-4.6 0c0-1.2.9-2.1 2.3-3.6z" fill="#fff3c4"/></svg><div><small>STREAK</small><b><span id="tStreak">0</span> <span id="tDays">days</span></b></div><div class="wk" id="wk"></div></div>
    <div class="goalrow"><div><small>FOCUS GOAL</small><b id="goalNow">0m</b></div><em id="goalPct">0%</em></div>
    <div class="gbar"><i id="goalBar"></i></div>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
const MIN_LOG = 60e3, DAY = 864e5, MIN = 60e3;
// Pomodoro blocks and the break that follows each.
const BLOCKS = [30, 60, 90], BREAK_FOR = {30: 5, 60: 15, 90: 20}, KEEP_GOING = 30;
const breakFor = min => (BREAK_FOR[min] || 5) * MIN;

// In the app, data lives in files the app reads and writes; in a browser it uses localStorage.
const NATIVE = !!window.__NATIVE;
const native = msg => { try { window.webkit.messageHandlers.native.postMessage(msg); } catch (e) {} };
if (!NATIVE) document.body.classList.add('preview');
const store = {
  get(k, d) { try { const v = NATIVE ? (window.__STORE || {})[k] : localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { const s = JSON.stringify(v); if (NATIVE) { native({type: 'store', key: k, value: s}); return; } try { localStorage.setItem(k, s); } catch (e) {} },
};
let logs = store.get('studyradio.logs', []);
// The dashboard window sends the log back when it deletes or restores a session.

/* ---------- status line ---------- */

// The menu bar shortcut and the main button: start, pause or resume whatever is going.
function start() {

// Clicking the time cycles the timer: count up, then 30, 60 and 90 minute Pomodoros.
function cycleMode() {

  const order = ['free', ...BLOCKS], now = S.mode === 'pomo' ? S.pomoMin : 'free', next = order[(order.indexOf(now) + 1) % order.length];
  if (next === 'free') S.mode = 'free'; else { S.mode = 'pomo'; S.pomoMin = next; }

// After 30 minutes with nothing running, a macOS notification nudges you to start; its button starts counting up.
const NUDGE_AFTER = 30 * MIN;
const NUDGES = [
  ['Start a session?', 'Time won\u2019t come back. Even 20 focused minutes counts.'],
  ['Ready to focus?', 'The hardest part is starting. Let\u2019s go.'],
  ['Your future self says hi', 'One focused session now beats an hour of scrolling.'],
  ['Still here?', 'Pick one thing and give it your full attention.'],
  ['Small steps, big progress', 'Start the timer and see where it takes you.'],
];
let idleSince = Date.now(), nudgeN = Math.floor(Math.random() * NUDGES.length);
function nudgeCheck() {

  if (Date.now() - idleSince < NUDGE_AFTER) return;
  idleSince = Date.now();

window.startCountUp = () => {

};
let lastMinute = -1;

  if (S.status === 'running' && S.mode === 'pomo' && elapsed() >= S.blockMin * MIN) {

/* ---------- questions: finished blocks and breaks ---------- */
let notice = null, noticeSeq = 0, pending = null, afterTopic = '', panelOpen = !NATIVE;
let askCatTouched = false, askCatChoice = new Set(), askCatNotice = 0;
const btn = (id, label, style) => ({id, label, style: style || 'secondary'});
const N = {
  done: total => ({title: 'Focus complete', text: `${Math.round(total / MIN)} minutes of deep work. Well done.`, buttons: [btn('log', 'Log it', 'primary'), btn('keep', 'Keep going')]}),
  chainEnd: () => ({title: 'Focus works best in blocks', text: 'Take a break, you’ve earned it.', buttons: [btn('log', 'Log it', 'primary'), btn('keep', 'Keep going')]}),
  topic: () => ({title: 'What did you work on?', text: sessionLine(pending), input: true, needsTopic: 'save', chips: recentTopics(4), buttons: [btn('discard', 'Discard'), btn('save', 'Save', 'primary')]}),
  next: () => { const m = Math.round(breakFor(S.pomoMin) / MIN); return {title: 'Logged. Nice work.', text: `Take a ${m}-minute break, or keep the momentum?`, buttons: [btn('break', 'Take break', 'primary'), btn('focus', 'Start Focus')]}; },

// A question shows in the panel while it's open, otherwise in the Island under the notch, until it's answered.

// Celebrations (a new badge, a new level, the daily goal) wait in line and show when nothing else is asked.

function askPress(id) {

/* ---------- drawing ---------- */
const PIE = ['○', '◔', '◑', '◕', '●'];
let lastMenu = null;
function renderClock() {

  else if (st === 'breakPaused') { ms = S.breakLeft; p = 1 - ms / S.breakTotal; }

  const menu = st === 'idle' ? '' : (st === 'paused' || st === 'breakPaused' ? '⏸ ' : pie) + text;

let ac;
function chime() {
  try {
    ac = ac || new AudioContext(); if (ac.state === 'suspended') ac.resume();
    [880, 1320].forEach((f, i) => {
      const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime + i * .22;
      o.type = 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.25, t + .02); g.gain.exponentialRampToValueAtTime(.001, t + 1.2);
      o.connect(g).connect(ac.destination); o.start(t); o.stop(t + 1.3);
    });
  } catch (e) {}
}

new ResizeObserver(() => native({type: 'resize', h: Math.ceil($('#panel').getBoundingClientRect().height)})).observe($('#panel'));

/* ---------- boot ---------- */
render(); checkUnlocks(true);
if (restored) say('Paused while the app was closed.', 10000);
setInterval(tick, 250);
setInterval(() => { if (S.status === 'running') saveState(); }, 5000);
addEventListener('pagehide', saveState);
// ?demo previews states for screenshots: focus (default), idle, paused, break, done, topic.
const params = new URLSearchParams(location.search);
if (params.has('demo')) {
  const kind = params.get('demo') || 'focus', d0 = dayStart(Date.now());
  const mk = (day, h, min, topic) => ({id: day + '-' + h, start: d0 - day * DAY + h * 36e5, end: d0 - day * DAY + h * 36e5 + min * MIN, ms: min * MIN, topic});
  logs = [mk(0, .1, 30, 'Security+ notes'), mk(0, .05, 60, 'Linear algebra'), mk(1, 9, 130, 'AWS AI Practitioner'), mk(2, 10, 125, 'Reading'), mk(3, 11, 150, 'System design'), mk(4, 6.5, 120, 'Reading'), mk(5, 9, 95, 'System design')];
  Object.assign(S, {mode: 'pomo', pomoMin: 60, blockMin: 60, status: 'idle'});
  if (kind === 'focus' || kind === 'paused') Object.assign(S, {status: 'running', startedAt: Date.now() - 23 * MIN - 47e3, segStart: Date.now() - 23 * MIN - 47e3, acc: 0});
  if (kind === 'paused') pauseFocus();
  if (kind === 'break') Object.assign(S, {status: 'break', breakTotal: 15 * MIN, breakEnds: Date.now() + 11 * MIN + 12e3});
  render();
  if (kind === 'done') { pending = {start: Date.now() - 60 * MIN, end: Date.now(), ms: 60 * MIN}; afterTopic = 'next'; present(N.done(60 * MIN)); }
  if (kind === 'topic') { pending = {start: Date.now() - 60 * MIN, end: Date.now(), ms: 60 * MIN}; afterTopic = 'next'; present(N.topic()); }
}
</script>
