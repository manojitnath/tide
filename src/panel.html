<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Focus MN</title>
<style>
/* Light: soft blue-grey with pastel cards. Dark: near-black. Both use the same bevel: a lit top edge, a soft lower edge and depth below. */
:root{--round:ui-rounded,-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --bg:linear-gradient(#f7f8fc,#eceff6);--ink:#16181d;--muted:#6b7183;--card:linear-gradient(#fff,#f6f7fb);--line:rgba(20,40,90,.08);--field:#eef2fb;
  --accent:#1f5cf2;
  --pReady:#fbf0d9;--pFocus:#d6e6fd;--pBreak:#e5f5cd;--tReady:#4c3b19;--tFocus:#0f2b4f;--tBreak:#21400f;--tagInk:#fff;--timeInk:var(--tag);
  --sheen:linear-gradient(rgba(255,255,255,.55),rgba(255,255,255,0) 55%);
  --bevel:inset 0 1px 0 rgba(255,255,255,.95),inset 0 -1px 0 rgba(20,40,90,.06),0 0 0 .5px rgba(20,40,90,.08),0 1px 2px rgba(20,40,90,.06),0 10px 24px -8px rgba(20,40,90,.16);
  --player:#1f5cf2;--playerIcon:#1f5cf2;--playerShadow:inset 0 1px 0 rgba(255,255,255,.35),0 0 0 .5px rgba(20,40,90,.15),0 16px 30px -12px rgba(31,92,242,.55);
  --chip:linear-gradient(#fff,#f1f3f8);--chipShadow:inset 0 1px 0 #fff,0 0 0 .5px rgba(20,40,90,.1),0 2px 6px rgba(20,40,90,.1);--trackBg:rgba(255,255,255,.7);--track:inset 0 1px 2px rgba(20,40,90,.12)}
@media (prefers-color-scheme: dark){:root{
  --bg:#161616;--ink:#f2f2f2;--muted:#8a8a8a;--card:linear-gradient(#222,#1c1c1c);--line:rgba(255,255,255,.08);--field:#2a2a2a;
  --accent:#3a73ff;
  --pReady:#1f1f1f;--pFocus:#1f1f1f;--pBreak:#1f1f1f;--tReady:#f4d38f;--tFocus:#9ec2ff;--tBreak:#b4e38a;--tagInk:#121212;--timeInk:var(--ink);
  --sheen:linear-gradient(rgba(255,255,255,.03),rgba(255,255,255,0) 55%);
  --bevel:inset 0 1px 0 rgba(255,255,255,.07),inset 0 -1px 0 rgba(0,0,0,.4),0 0 0 .5px rgba(255,255,255,.09),0 1px 2px rgba(0,0,0,.4),0 10px 24px -8px rgba(0,0,0,.6);
  --player:#1f1f1f;--playerIcon:#161616;--playerShadow:var(--bevel);
  --chip:linear-gradient(#333,#272727);--chipShadow:inset 0 1px 0 rgba(255,255,255,.07),0 0 0 .5px rgba(255,255,255,.08);--trackBg:rgba(255,255,255,.08);--track:inset 0 1px 2px rgba(0,0,0,.5)}}
*{box-sizing:border-box}
html,body{margin:0;background:transparent;color:var(--ink);font:13px/1.35 -apple-system,BlinkMacSystemFont,system-ui,sans-serif;-webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none;cursor:default}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
input{font:inherit;color:inherit;-webkit-user-select:text;user-select:text}
[hidden]{display:none!important}
/* In a browser the panel sits on a plain backdrop; in the app the window clips it to rounded corners. */
body.preview{background:#dde5f8;min-height:100vh;padding:30px}
body.preview .panel{border-radius:20px;box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 0 0 .5px rgba(20,40,90,.12),0 22px 50px rgba(20,40,90,.25)}
@media (prefers-color-scheme: dark){body.preview{background:#0a0a0a}body.preview .panel{box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 0 0 .5px rgba(255,255,255,.1),0 22px 50px rgba(0,0,0,.6)}}
.panel{width:320px;padding:12px;display:flex;flex-direction:column;gap:10px;position:relative;background:var(--bg)}

/* the timer card: pastel in light, black in dark, with a soft glow of the state's colour at the bottom */
.timecard{border-radius:22px;padding:14px 16px 12px;background-color:var(--pReady);--tag:var(--tReady);--glow:244,211,143;box-shadow:var(--bevel);
  background-image:var(--sheen),radial-gradient(120% 90% at 50% 125%,rgba(var(--glow),.25),transparent 70%)}
.running .timecard{background-color:var(--pFocus);--tag:var(--tFocus);--glow:58,115,255}
.break .timecard,.breakPaused .timecard{background-color:var(--pBreak);--tag:var(--tBreak);--glow:120,200,80}
.head{display:flex;justify-content:space-between;align-items:flex-start}
.state{display:inline-flex;align-items:center;background:var(--tag);color:var(--tagInk);border-radius:99px;padding:4px 11px;font-size:12px;font-weight:600}
.paused .state,.breakPaused .state{animation:pulse 1.4s ease-in-out infinite alternate;will-change:opacity}
@keyframes pulse{from{opacity:1}to{opacity:.4}}
.time{display:block;text-align:left;font:600 52px/1.05 var(--round);letter-spacing:-.01em;font-variant-numeric:tabular-nums;margin-top:10px;color:var(--timeInk);border-radius:10px}
.time.long{font-size:44px}
.idle .time{cursor:pointer}
.idle .time:hover{opacity:.75}
.icon{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--ink);background:var(--chip);box-shadow:var(--chipShadow)}
.icon:hover{color:var(--accent)}
.icon svg{width:17px;height:17px}
/* the menu: the corner button turns into a close button and the others drop down under it */
.menu{position:relative;z-index:10}
.menu .x,.menu.open .dots{display:none}
.menu.open .x{display:block}
.menu .icon{width:35px;height:35px}
.menu .icon svg{width:15.5px;height:15.5px}
.menu.open #gear{box-shadow:var(--chipShadow),0 0 0 1.5px var(--accent)}
.mlist{position:absolute;right:-5px;top:39px;display:flex;flex-direction:column;gap:6px;padding:5px;border-radius:99px;visibility:hidden;opacity:0;transform:translateY(-6px);transition:opacity .18s,transform .18s,visibility 0s .18s;
  background:#eef1f7;box-shadow:inset 0 1px 0 #fff,0 0 0 .5px rgba(20,40,90,.12),0 14px 30px -8px rgba(20,40,90,.35)}
@media (prefers-color-scheme: dark){.mlist{background:#161616;box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 0 0 .5px rgba(255,255,255,.1),0 14px 30px -8px rgba(0,0,0,.8)}}
.menu.open .mlist{opacity:1;transform:none;transition:opacity .18s,transform .18s}
.menu.open .mlist{visibility:visible}
#quit:hover{color:#ff453a}
#progWrap{margin-top:10px}
.prog{height:6px;border-radius:9px;background:var(--trackBg);box-shadow:var(--track);overflow:hidden}
.prog i{display:block;height:100%;width:0;border-radius:9px;background:var(--tag);transition:width .25s linear}
/* Always one line tall, even when empty, so nothing below moves when the text comes and goes. */
.progmeta{display:flex;justify-content:space-between;font-size:11.5px;line-height:15px;height:15px;color:var(--muted);font-weight:500;margin-top:6px;white-space:nowrap}
.progmeta #note,.progmeta.noted span{display:none}
.progmeta.noted #note{display:block;color:var(--ink);font-weight:600;overflow:hidden;text-overflow:ellipsis}

/* the radio: a rounded square; the live video fills it, the controls float on top */
.player{position:relative;height:244px;border-radius:24px;overflow:hidden;color:#fff;background:var(--player);box-shadow:var(--playerShadow)}
.cover{position:absolute;inset:0;transition:opacity .6s;
  background-image:linear-gradient(rgba(255,255,255,.12),rgba(255,255,255,0) 45%,rgba(0,0,40,.1)),
    radial-gradient(circle at 100% 0,transparent 0 70px,rgba(255,255,255,.16) 70px 71px,transparent 71px 118px,rgba(255,255,255,.12) 118px 119px,transparent 119px),
    radial-gradient(circle at 100% 0,rgba(255,255,255,.07) 0 118px,transparent 118px)}
@media (prefers-color-scheme: dark){.cover{background-image:linear-gradient(rgba(255,255,255,.03),rgba(255,255,255,0) 45%),
  radial-gradient(circle at 100% 0,transparent 0 70px,rgba(255,255,255,.07) 70px 71px,transparent 71px 118px,rgba(255,255,255,.05) 118px 119px,transparent 119px),
  radial-gradient(120% 80% at 50% 120%,rgba(58,115,255,.25),transparent 70%)}}
.ytbox{position:absolute;inset:0;opacity:0;transition:opacity .6s;background:#000}
.ytbox iframe{position:absolute;left:50%;top:50%;width:470px;height:264px;transform:translate(-50%,-50%);border:0;pointer-events:none}
.shade{position:absolute;inset:0;opacity:0;transition:opacity .6s;background:linear-gradient(rgba(0,0,0,.35),transparent 38%,transparent 50%,rgba(0,0,0,.6))}
.playing .ytbox,.playing .shade{opacity:1}
.playing .cover{opacity:0}
.ptop{position:absolute;left:10px;right:10px;top:10px;display:flex;gap:8px}
.glass{background:rgba(255,255,255,.18);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:inset 0 1px 0 rgba(255,255,255,.25)}
.glass:hover{background:rgba(255,255,255,.26)}
.pill{flex:1;min-width:0;display:flex;align-items:center;gap:9px;padding:5px 14px 5px 5px;border-radius:99px;text-align:left;color:#fff}
.ava{width:36px;height:36px;border-radius:50%;background:#fff;color:var(--playerIcon);display:grid;place-items:center;flex:none}
.ava svg{width:18px;height:18px}
.pt{min-width:0;flex:1}
.marq{width:100%;overflow:hidden;white-space:nowrap;font:600 14px/1.2 var(--round)}
.marq span{display:inline-block}
.marq.scroll span{padding-left:100%;animation:marq 9s linear infinite}
@keyframes marq{to{transform:translateX(-100%)}}
.pt small{display:flex;align-items:center;gap:5px;font-size:11.5px;font-weight:500;opacity:.75}
.pt small i{width:6px;height:6px;border-radius:50%;background:#ff453a;display:none}
.playing .pt small i{display:block}
.cb{width:46px;height:46px;border-radius:50%;flex:none;display:grid;place-items:center;color:#fff}
.cb svg{width:17px;height:17px}
#stopRadio svg{width:12px;height:12px}
.cb.big{width:56px;height:56px;background:#fff;color:var(--playerIcon);box-shadow:inset 0 -2px 0 rgba(20,40,90,.08),0 4px 12px rgba(0,0,40,.3)}
.cb.big svg{width:22px;height:22px}
.pbot{position:absolute;left:16px;right:16px;bottom:12px}
.volrow{display:flex;align-items:center;gap:9px}
.volrow svg{width:15px;height:15px;opacity:.8;flex:none}
.vbar{flex:1;height:18px;display:flex;align-items:center;cursor:pointer;touch-action:none}
.vbar div{width:100%;height:5px;border-radius:9px;background:rgba(255,255,255,.3);overflow:hidden}
.vbar i{display:block;height:100%;border-radius:9px;background:#fff}
.ctrls{display:flex;justify-content:center;align-items:center;gap:20px;margin-top:8px}
.stations{position:absolute;left:22px;right:22px;z-index:5;border-radius:16px;padding:6px;max-height:260px;overflow:auto;background:var(--card);box-shadow:var(--bevel),0 14px 34px rgba(0,0,0,.25)}
@media (prefers-color-scheme: dark){.stations{background:#232323}}
.stations button{display:flex;justify-content:space-between;width:100%;padding:7px 10px;border-radius:9px;text-align:left}
.stations button:hover{background:var(--field)}
.stations button span{color:var(--muted);font-variant-numeric:tabular-nums}
.stations button[aria-current="true"]{font-weight:700;color:var(--accent)}

/* buttons: the main action solid blue, a second action a raised card-coloured pill beside it */
.duo{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:10px}
/* A little more room under the player and under the main buttons, so they don't crowd what follows. */
.player,#actions{margin-bottom:6px}
.duo button{min-width:0;height:46px;border-radius:99px;font:600 16px var(--round);letter-spacing:-.01em}
.duo .primary{color:#fff;background:linear-gradient(#3a72ff,#1f5cf2);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),inset 0 -1px 0 rgba(0,0,40,.15),0 8px 18px -8px rgba(31,92,242,.7)}
.duo .secondary{color:var(--ink);background:var(--card);box-shadow:var(--bevel)}
.duo .primary:hover{filter:brightness(1.06)}
.duo .secondary:hover{color:var(--accent)}
.duo button:active{transform:scale(.985)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{border-radius:16px;padding:10px 12px;background:var(--card);box-shadow:var(--bevel)}
.stat small{display:block;font-size:11px;color:var(--muted);font-weight:500}
.stat b{display:block;font:600 19px var(--round);margin:2px 0 1px;font-variant-numeric:tabular-nums}
.stat span{font-size:10.5px;color:var(--muted)}

/* questions (end of a block or break), shown here when the panel is open, otherwise in the Island under the notch */
.ask{display:flex;flex-direction:column;gap:9px;border-radius:20px;padding:13px;background:var(--card);box-shadow:var(--bevel)}
.ask h2{margin:0;font:600 16px var(--round);text-align:center}
.ask p{margin:-4px 0 2px;color:var(--muted);text-align:center}
.ask input::-webkit-calendar-picker-indicator{display:none!important}
.ask input{width:100%;padding:9px 11px;border-radius:12px;border:0;background:var(--field);box-shadow:var(--track);outline:none;font-size:14px}
.ask input:focus{box-shadow:var(--track),0 0 0 3px color-mix(in srgb,var(--accent) 35%,transparent)}
.ask input.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.chips button{background:var(--chip);box-shadow:var(--chipShadow);border-radius:99px;padding:4px 10px;font-size:12px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chips button:hover{color:var(--accent)}
</style>
</head>
<body class="idle">
<div class="panel" id="panel">
  <div class="timecard">
  <div class="head">
    <div><div class="state"><i></i><span id="state">Pomodoro</span></div>
      <button class="time" id="time" type="button" title="Click to switch: Count up, 30, 60 or 90 minutes">30:00</button></div>
    <div class="menu" id="menu">
      <button class="icon" id="gear" type="button" title="Menu"><svg class="dots" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg><svg class="x" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
      <div class="mlist">
        <button class="icon" id="openLog" type="button" title="Dashboard"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="11" width="3.4" height="8" rx="1"/><rect x="10.3" y="5" width="3.4" height="14" rx="1"/><rect x="16.6" y="8" width="3.4" height="11" rx="1"/></svg></button>
        <button class="icon" id="openSettings" type="button" title="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
        <button class="icon" id="quit" type="button" title="Quit Focus MN"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 3.5v8"/><path d="M7 6.3a7.5 7.5 0 1 0 10 0"/></svg></button>
      </div>
    </div>
  </div>
  <div id="progWrap"><div class="prog"><i id="prog"></i></div><div class="progmeta" id="progmeta"><span id="progA"></span><span id="progB"></span><span id="note"></span></div></div>
  </div>

  <div class="player" id="disc">
    <div class="ytbox"><div id="ytFrame"></div></div>
    <div class="cover"></div>
    <div class="shade"></div>
    <div class="ptop">
      <button class="pill glass" id="stationBtn" type="button" title="Choose a station"><span class="ava"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 9h16a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1v-9a1 1 0 0 1 1-1zm3-5 9 5H7zm1 9a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5zm7 1h3v1.4h-3zm0 2.6h3V18h-3z"/></svg></span><span class="pt"><div class="marq" id="marq"><span id="stName">Lofi Girl: Study</span></div><small><i></i><span id="stSub">FM 88.6</span></small></span></button>
      <button class="cb glass" id="stopRadio" type="button" title="Stop the radio"><svg viewBox="0 0 10 10"><rect width="10" height="10" rx="2.4" fill="currentColor"/></svg></button>
    </div>
    <div class="pbot">
      <div class="volrow"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 9h4l5-4v14l-5-4H4z"/></svg><div class="vbar" id="vol" title="Volume"><div><i id="volFill"></i></div></div><svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 9h4l5-4v14l-5-4H4zm12.5-1.5a6 6 0 0 1 0 9l-1.2-1.2a4.3 4.3 0 0 0 0-6.6zM19 5a9.5 9.5 0 0 1 0 14l-1.2-1.2a7.8 7.8 0 0 0 0-11.6z"/></svg></div>
      <div class="ctrls">
        <button class="cb glass" id="prevSt" type="button" title="Previous station"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h2.4v14H6zm3.6 7L19 5.5v13z"/></svg></button>
        <button class="cb big" id="radioBtn" type="button" title="Play or pause the radio"></button>
        <button class="cb glass" id="nextSt" type="button" title="Next station"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M15.6 5H18v14h-2.4zM5 5.5l9.4 6.5L5 18.5z"/></svg></button>
      </div>
    </div>
  </div>
  <div class="stations" id="stations" hidden role="menu"></div>

  <div class="actions" id="actions"></div>
  <div class="ask" id="ask" hidden>
    <h2 id="askTitle"></h2><p id="askText"></p>
    <input type="text" id="askInput" list="topicList" maxlength="80" placeholder="What did you work on?" hidden autocomplete="off">
    <datalist id="topicList"></datalist>
    <div class="chips" id="askChips"></div>
    <div class="duo" id="askBtns"></div>
  </div>
  <div class="stats">
    <div class="stat"><small>Today</small><b id="tToday">0m</b><span id="tTodayN">0 sessions</span></div>
    <div class="stat"><small>Streak</small><b id="tStreak">0</b><span>days</span></div>
    <div class="stat"><small>This week</small><b id="tWeek">0m</b><span id="tWeekN">0 sessions</span></div>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
// YouTube stations play a channel's live stream. A stream's ID changes when the channel restarts it, so each station
// also names its channel and words from the stream's title; the app looks up the current ID on launch and whenever
// a stream fails. yt is the last known ID.
const STATIONS = [
  {name:'Lofi Girl: Study',     f:88.6,  ch:'LofiGirl',      match:['lofi hip hop radio', 'study'], yt:'rFZHOHl-L8A'},
  {name:'Lofi Girl: Jazz',      f:90.4,  ch:'LofiGirl',      match:['jazz lofi radio'],           yt:'E2vONfzoyRI'},
  {name:'Lofi Girl: Piano',     f:92.2,  ch:'LofiGirl',      match:['piano radio'],               yt:'N0snMcR6aaA'},
  {name:'Lofi Girl: Asian',     f:94.0,  ch:'LofiGirl',      match:['asian lofi radio'],          yt:'1Tl2FtV06qo'},
  {name:'Lofi Girl: Rainy',     f:95.8,  ch:'LofiGirl',      match:['sad lofi radio'],            yt:'CwPCy1GLS38'},
  {name:'Lofi Girl: Synthwave', f:97.6,  ch:'LofiGirl',      match:['synthwave radio'],           yt:'4xDzrJKXOOY'},
  {name:'Chillhop: Radio',      f:99.4,  ch:'ChillhopMusic', match:['chillhop radio'],            yt:'5yx6BWlEVcY'},
  {name:'Chillhop: Late Night', f:101.2, ch:'ChillhopMusic', match:['late night vibes'],          yt:'i6WzngxTnBA'},
  {name:'Steezyasfuck: Lofi',   f:102.8, ch:'steezyasfvck',  match:['lofi hip hop radio'],        yt:'uWzSqdcfPZw'},
  {name:'Bits & Hits: Gaming',  f:104.4, ch:'FantasyLofi',   match:['gaming lofi radio'],         yt:'Fo5BDohM9Fo'},
];
const MIN_LOG = 60e3, DAY = 864e5, MIN = 60e3;
// Pomodoro blocks and the break that follows each.
const BLOCKS = [30, 60, 90], BREAK_FOR = {30: 5, 60: 15, 90: 20}, KEEP_GOING = 30;
const breakFor = min => (BREAK_FOR[min] || 5) * MIN;

// In the app, data lives in files the app reads and writes; in a browser it uses localStorage.
const NATIVE = !!window.__NATIVE;
const native = msg => { try { window.webkit.messageHandlers.native.postMessage(msg); } catch (e) {} };
if (!NATIVE) document.body.classList.add('preview');
const store = {
  get(k, d) { try { const v = NATIVE ? (window.__STORE || {})[k] : localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { const s = JSON.stringify(v); if (NATIVE) { native({type: 'store', key: k, value: s}); return; } try { localStorage.setItem(k, s); } catch (e) {} },
};
let logs = store.get('studyradio.logs', []);
// The dashboard window sends the log back when it deletes or restores a session.
window.__syncLogs = data => { logs = Array.isArray(data) ? data : []; renderStats(); };

/* ---------- status line ---------- */

/* ---------- focus and breaks ---------- */

const NUDGE_AFTER = 30 * MIN;
const NUDGES = [

/* ---------- questions: finished blocks and breaks ---------- */

/* ---------- drawing ---------- */
const PIE = ['○', '◔', '◑', '◕', '●'];

/* ---------- today, streak and week ---------- */
function renderStats() {

  $('#tWeek').textContent = dur(sum(w)); $('#tWeekN').textContent = plural(w.length, 'session');

/* ---------- sounds ---------- */
let ac;
function chime() {

    ac = ac || new AudioContext(); if (ac.state === 'suspended') ac.resume();

/* ---------- radio (official YouTube embed, filling the square player) ---------- */

  const kind = params.get('demo') || 'focus', d0 = dayStart(Date.now());
  const mk = (day, h, min, topic) => ({id: day + '-' + h, start: d0 - day * DAY + h * 36e5, end: d0 - day * DAY + h * 36e5 + min * MIN, ms: min * MIN, topic});
  logs = [mk(0, .1, 30, 'Security+ notes'), mk(0, .05, 60, 'Linear algebra'), mk(1, 9, 60, 'AWS AI Practitioner'), mk(2, 10, 30, 'Reading'), mk(3, 11, 90, 'System design')];
  Object.assign(S, {mode: 'pomo', pomoMin: 60, blockMin: 60, status: 'idle'});
  if (kind === 'focus' || kind === 'paused') Object.assign(S, {status: 'running', startedAt: Date.now() - 23 * MIN - 47e3, segStart: Date.now() - 23 * MIN - 47e3, acc: 0});
  if (kind === 'paused') pauseFocus();
  if (kind === 'break') Object.assign(S, {status: 'break', breakTotal: 15 * MIN, breakEnds: Date.now() + 11 * MIN + 12e3});
  // The video only plays in the app, so a browser preview keeps the blue cover.
  radioOn = kind !== 'idle'; document.body.classList.toggle('playing', radioOn && NATIVE); showStation();
  render();
  if (kind === 'done') { pending = {start: Date.now() - 60 * MIN, end: Date.now(), ms: 60 * MIN}; afterTopic = 'next'; present(N.done(60 * MIN)); }
  if (kind === 'topic') { pending = {start: Date.now() - 60 * MIN, end: Date.now(), ms: 60 * MIN}; afterTopic = 'next'; present(N.topic()); }
}
