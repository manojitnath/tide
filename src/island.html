<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Focus MN Island</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:transparent;font:13px/1.35 -apple-system,BlinkMacSystemFont,system-ui,sans-serif;-webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none;cursor:default}
body.preview{background:linear-gradient(#6cc4f7,#9bd6f8);min-height:100vh}
/* A black island hanging from the notch, holding a blue card. */
/* --top is the menu bar's height (the notch on newer Macs), so the card starts below it. */
.island{width:360px;margin:0 auto;background:#000;border-radius:0 0 30px 30px;padding:calc(var(--top, 0px) + 6px) 6px 6px}
.card{position:relative;overflow:hidden;color:#fff;background:#1f5cf2;border-radius:24px;padding:14px 14px 12px;display:flex;flex-direction:column;gap:10px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.3),inset 0 -1px 0 rgba(0,0,40,.2);
  background-image:linear-gradient(rgba(255,255,255,.12),rgba(255,255,255,0) 45%),
    radial-gradient(circle at 100% 0,transparent 0 70px,rgba(255,255,255,.16) 70px 71px,transparent 71px 112px,rgba(255,255,255,.12) 112px 113px,transparent 113px),
    radial-gradient(circle at 100% 0,rgba(255,255,255,.07) 0 112px,transparent 112px)}
.top{display:flex;align-items:center;gap:12px}
.logo{width:44px;height:44px;border-radius:50%;background:#fff;color:#1f5cf2;display:grid;place-items:center;flex:none;box-shadow:0 3px 10px rgba(0,0,40,.25)}
.logo svg{width:22px;height:22px}
h1{margin:0;font:600 19px/1.15 ui-rounded,-apple-system,system-ui}
p{margin:2px 0 0;color:rgba(255,255,255,.8);font-size:13px;font-weight:500}
input{width:100%;padding:9px 13px;border-radius:14px;border:0;background:rgba(255,255,255,.14);color:#fff;font:15px -apple-system,system-ui;outline:none;box-shadow:inset 0 1px 2px rgba(0,0,40,.25),inset 0 0 0 1px rgba(255,255,255,.2);-webkit-user-select:text;user-select:text}
input::placeholder{color:rgba(255,255,255,.6)}
input:focus{box-shadow:inset 0 1px 2px rgba(0,0,40,.25),inset 0 0 0 1px rgba(255,255,255,.6)}
input.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips:empty{display:none}
.chips button{background:rgba(255,255,255,.16);color:#fff;border:0;border-radius:99px;padding:5px 11px;font:500 12px -apple-system,system-ui;cursor:pointer;max-width:200px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-shadow:inset 0 1px 0 rgba(255,255,255,.2)}
.chips button:hover{background:rgba(255,255,255,.26)}
/* One white capsule; the main action is the blue pill inside it. */
.btns{display:flex;background:#fff;border-radius:99px;padding:3px;margin-top:2px;box-shadow:inset 0 -1px 0 rgba(0,0,40,.1),0 6px 14px -6px rgba(0,0,40,.45)}
.btns button{flex:1;border:0;border-radius:99px;height:42px;font:600 15px ui-rounded,-apple-system,system-ui;cursor:pointer;background:transparent;color:#1f5cf2}
.btns .primary{background:linear-gradient(#3a72ff,#1f5cf2);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 1px 3px rgba(0,0,40,.3)}
.btns button:active{transform:scale(.97)}
.handle{width:32px;height:4px;border-radius:9px;background:#3a3a3c;margin:6px auto 0}
</style>
</head>
<body>
<div class="island" id="island">
  <div class="card">
    <div class="top"><div class="logo"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.5" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M12 12V5.5a6.5 6.5 0 0 1 6.5 6.5z" fill="currentColor"/></svg></div>
      <div><h1 id="title"></h1><p id="text"></p></div></div>
    <input id="topic" type="text" maxlength="80" hidden autocomplete="off">
    <div class="chips" id="chips"></div>
    <div class="btns" id="btns"></div>
  </div>
  <div class="handle"></div>
</div>
<script>
const $ = s => document.querySelector(s);
const native = msg => { try { window.webkit.messageHandlers.native.postMessage(msg); } catch (e) {} };
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
let notice = null;
// The panel page decides what to ask; this page only shows it and reports which button was pressed.
function setNotice(n) {
  notice = n;
  $('#title').textContent = n.title || '';
  $('#text').textContent = n.text || '';
  $('#topic').hidden = !n.input;
  $('#topic').value = '';
  $('#topic').placeholder = n.placeholder || 'What did you work on?';
  $('#chips').innerHTML = (n.input && n.chips || []).map(t => `<button type="button">${esc(t)}</button>`).join('');
  $('#btns').innerHTML = n.buttons.map(b => `<button type="button" class="${b.style || 'secondary'}" data-id="${esc(b.id)}">${esc(b.label)}</button>`).join('');
  if (n.input) setTimeout(() => $('#topic').focus(), 60);
  report();
}
function press(id) {
  const topic = $('#topic').value.trim();
  // Saving needs a topic; shake the field instead of sending an empty one.
  if (notice && notice.input && notice.needsTopic === id && !topic) {
    const i = $('#topic'); i.classList.remove('shake'); void i.offsetWidth; i.classList.add('shake'); i.focus(); return;
  }
  native({type: 'noticeAction', id, topic});
}
$('#btns').onclick = e => { const b = e.target.closest('button'); if (b) press(b.dataset.id); };
$('#chips').onclick = e => { const b = e.target.closest('button'); if (b) { $('#topic').value = b.textContent; $('#topic').focus(); } };
$('#topic').addEventListener('keydown', e => { if (e.key === 'Enter' && notice) press(notice.needsTopic || notice.buttons[notice.buttons.length - 1].id); });
window.setTopInset = px => document.documentElement.style.setProperty('--top', px + 'px');
function report() { native({type: 'resize', h: Math.ceil($('#island').getBoundingClientRect().height)}); }
new ResizeObserver(report).observe($('#island'));
// ?demo previews a notice in a browser.
const q = new URLSearchParams(location.search);
if (!window.__NATIVE) document.body.classList.add('preview');
if (q.has('top')) setTopInset(+q.get('top'));
if (q.has('demo')) {
  const demos = {
    break: {title: 'Break complete', text: 'Nice reset. Focus when you’re ready.', buttons: [{id: 'focus', label: 'Start Focus', style: 'primary'}, {id: 'plus5', label: '+5 min'}]},
    done: {title: 'Focus complete', text: '30 minutes of deep work. Well done.', buttons: [{id: 'log', label: 'Log it', style: 'primary'}, {id: 'keep', label: 'Keep going'}]},
    topic: {title: 'What did you work on?', text: '30m of focus, 9:10 to 9:40 AM', input: true, needsTopic: 'save', chips: ['Security+ notes', 'Linear algebra', 'AWS AI Practitioner'],
      buttons: [{id: 'discard', label: 'Discard'}, {id: 'save', label: 'Save', style: 'primary'}]},
  };
  setNotice(demos[q.get('demo')] || demos.break);
}
</script>
</body>
</html>
